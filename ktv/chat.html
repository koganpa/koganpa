<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>WebSocket Chat</title>
  <style>
    body{font-family:system-ui;background:#f0f0f0;margin:0;padding:10px;}
    #log{height:300px;overflow:auto;background:#fff;padding:10px;border-radius:8px;}
    #text{width:80%;}
    #send{width:18%;}
  </style>
</head>
<body>
  <div id="log"></div>
  <input id="text" placeholder="メッセージ">
  <button id="send">送信</button>
  <p>更新ボタンを押すと履歴が削除されますので十分ご注意ください。</p>
  <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
  <script>
    const client = new Ably.Realtime("9zu1OQ.DiOgww:48QfeUeLxhVfL7YPLobd_MCvCCOJcj8MbZE5IlD65QE");
    const channel = client.channels.get("chat-room-1");

    const log = document.getElementById("log");

    function add(msg){
      const d = document.createElement("div");
      d.textContent = msg;
      log.appendChild(d);
      log.scrollTop = log.scrollHeight;
    }

    // メッセージ受信
    channel.subscribe("message", msg => {
      add(msg.data.text);
    });

    // 送信
    document.getElementById("send").onclick = () => {
      const text = document.getElementById("text").value;
      if(!text) return;

      channel.publish("message", { text });
      document.getElementById("text").value = "";
    };
  </script>
</body>
</html>
