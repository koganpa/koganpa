<!DOCTYPE html>
<html lang="ja">
<head>
    <link rel="stylesheet" href="index.css">
    <meta charset="UTF-8">
</head>
<body>
    <div class="container">
        <div class="time">
            <div class="clock"></div>
            <div class="date"></div>
        </div>
        <div class="box">Box 2</div>
        <div class="weather">
            <div class="weather-container">
                <table id="daily-table">
                    <thead>
                        <tr>
                            <th>今日</th>
                            <th>明日</th>
                        </tr>
                    </thead>
                    <tbody>
                      <tr id="daily-weather"></tr>
                      <tr id="daily-temp"></tr>
                      <tr id="daily-pop"></tr>
                    </tbody>
                </table>

                <table id="hourly-table">
                    <thead>
                      <tr id="hourly-time"></tr>
                    </thead>
                    <tbody>
                      <tr id="hourly-weather"></tr>
                      <tr id="hourly-temp"></tr>
                      <tr id="hourly-pop"></tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="box">Box 4</div>
    </div>
    <script src="index.js"></script>
    </body>
</html>
